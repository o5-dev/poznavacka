<!DOCTYPE html>
<html lang="cs" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poznávačka – výtvarná výchova</title>
<script>
// motiv se nastaví před prvním vykreslením, aby nebliklo
(function(){try{var p=localStorage.getItem('poznavacka-theme')||'system';
var d=p==='dark'||(p==='system'&&!matchMedia('(prefers-color-scheme: light)').matches);
document.documentElement.setAttribute('data-theme',d?'dark':'light');}catch(e){}})();
</script>
<style>
/* Poznávačka: klidná provozní deska. Neutrální tmavý základ, hairline linky, černobílá + stavové barvy. */
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,Menlo,monospace;
  --bg:#0b0c0d;--surface:#131415;--surface-2:#1a1b1d;--surface-3:#232426;
  --line:#26272a;--line-2:#36383c;
  --text:#ececed;--text-2:#b0b2b6;--text-3:#8a8d93;
  --accent:#f2f2f3;--accent-fg:#0b0c0d;--accent-weak:rgb(255 255 255/.1);
  --good:#4cc38a;--warn:#f0a23b;--bad:#f47474;--info:#6fa8ff;
  --good-weak:rgb(76 195 138/.15);--warn-weak:rgb(240 162 59/.14);--bad-weak:rgb(244 116 116/.14);
  --shadow:0 12px 36px rgb(0 0 0/.55);
  --r:12px;--r-sm:10px;--rail:236px;--top:52px;
  --ease:cubic-bezier(.22,1,.36,1);color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f4f5;--surface:#fff;--surface-2:#f6f7f8;--surface-3:#eceeef;
  --line:#e1e3e5;--line-2:#cfd2d5;
  --text:#141517;--text-2:#484b50;--text-3:#62666c;
  --accent:#17181a;--accent-fg:#fff;--accent-weak:rgb(20 21 23/.08);
  --good:#1b7f4f;--warn:#a8610a;--bad:#c23b3b;--info:#1f5fbf;
  --good-weak:rgb(27 127 79/.11);--warn-weak:rgb(168 97 10/.1);--bad-weak:rgb(194 59 59/.09);
  --shadow:0 12px 32px rgb(20 21 23/.14);color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:1.5rem;line-height:1.2}h2{font-size:1.125rem}h3{font-size:.9375rem}
p{margin:0}button{font:inherit;color:inherit}
::selection{background:var(--accent);color:var(--accent-fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.muted{color:var(--text-2)}.faint{color:var(--text-3)}.small{font-size:.8125rem}.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:.5rem}.row.wrap{flex-wrap:wrap}.sp{flex:1}.stack{display:flex;flex-direction:column;gap:.75rem}
.icon{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.icon.sm{width:15px;height:15px}
.hidden{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:.75rem .6rem 1rem;display:flex;flex-direction:column;gap:.15rem}
.brand{display:flex;align-items:center;gap:.6rem;padding:.35rem .5rem .8rem;font-weight:700;font-size:1.0625rem;letter-spacing:-.02em}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--accent);flex:none;position:relative}
.brand i::after{content:"";position:absolute;inset:6px;border-radius:2px;background:var(--accent-fg)}
.rail-group{margin:.8rem .6rem .2rem;font-size:.75rem;font-weight:600;color:var(--text-3)}
.rail-link{display:flex;align-items:center;gap:.7rem;padding:.45rem .6rem;border-radius:var(--r-sm);color:var(--text-2);font-weight:500;background:none;border:0;width:100%;text-align:left;cursor:pointer}
.rail-link:hover{background:var(--surface-2);color:var(--text)}
.rail-link.active{background:var(--accent-weak);color:var(--text);font-weight:600}
.rail-link .icon{color:var(--text-3);transition:color .15s}.rail-link:hover .icon,.rail-link.active .icon{color:var(--accent)}
.rail-link .count{margin-left:auto;font-size:.75rem;padding:0 .4rem;border-radius:99px;background:var(--bad);color:#fff;font-weight:650;min-width:1.3rem;text-align:center}
.rail-foot{margin-top:auto;padding-top:.6rem;border-top:1px solid var(--line);display:grid;gap:.15rem}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;z-index:20;height:var(--top);display:flex;align-items:center;gap:.75rem;padding:0 1.25rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .title{flex:1;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-prog{display:flex;align-items:center;gap:.7rem;font-size:.8125rem;color:var(--text-2)}
.tb-prog .meter{width:clamp(70px,16vw,180px)}
.content{padding:1.5rem 1.25rem 4rem;width:100%;max-width:1100px;margin:0 auto;flex:1;animation:fadein .3s var(--ease)}
@keyframes fadein{from{opacity:0;translate:0 6px}}
.page-head{margin-bottom:1.25rem}.page-head p{color:var(--text-2);margin-top:.25rem;max-width:62ch}
.bottombar{display:none}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:34px;padding:0 .9rem;font-weight:600;font-size:.875rem;color:var(--text);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover:not(:disabled){background:var(--surface-3)}.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}.btn.primary:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#fff)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-2)}.btn.ghost:hover:not(:disabled){background:var(--surface-2);color:var(--text)}
.btn.lg{height:40px;padding:0 1.2rem}
.btn.icon-only{width:34px;padding:0}
.input{font:inherit;font-size:.9375rem;color:var(--text);background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:.5rem .75rem;min-height:40px;width:100%;transition:border-color .15s}
.input:hover{border-color:var(--text-3)}.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.input::placeholder{color:var(--text-3)}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);flex-wrap:wrap}
.seg button{font-size:.8125rem;font-weight:550;border:0;background:transparent;color:var(--text-2);height:28px;padding:0 .75rem;border-radius:7px;cursor:pointer}
.seg button:hover{color:var(--text)}.seg button.on{background:var(--surface-3);color:var(--text);box-shadow:0 0 0 1px var(--line-2)}
.chip{display:inline-flex;align-items:center;gap:.4rem;height:28px;padding:0 .7rem;border-radius:99px;border:1px solid var(--line-2);background:transparent;color:var(--text-2);font-size:.8125rem;cursor:pointer}
.chip:hover{background:var(--surface-2);color:var(--text)}
.chip[aria-pressed=true]{background:var(--accent-weak);border-color:color-mix(in srgb,var(--accent) 60%,transparent);color:var(--text)}
.chip small{color:var(--text-3)}
.switch{position:relative;width:38px;height:22px;flex:none;border-radius:99px;background:var(--surface-3);border:1px solid var(--line-2);cursor:pointer;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-2);transition:translate .2s var(--ease),background .2s}
.switch[aria-checked=true]{background:var(--accent);border-color:transparent}.switch[aria-checked=true]::after{translate:16px 0;background:var(--accent-fg)}
.switch:disabled{opacity:.4;cursor:not-allowed}
.kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 .35rem;color:var(--text-2);background:var(--surface-2);min-width:1.4rem;text-align:center;display:inline-block}
.badge{display:inline-flex;align-items:center;gap:.35rem;height:20px;padding:0 .5rem;font-size:.75rem;font-weight:600;border-radius:99px;color:var(--text-2);background:var(--surface-3);white-space:nowrap}
.badge.good{color:var(--good);background:var(--good-weak)}.badge.bad{color:var(--bad);background:var(--bad-weak)}.badge.warn{color:var(--warn);background:var(--warn-weak)}
.meter{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}.meter>div{height:100%;background:var(--accent);border-radius:99px;transition:width .4s var(--ease)}
.meter.good>div{background:var(--good)}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);min-height:46px;flex-wrap:wrap}
.panel-h h3{margin-right:auto}
.panel-b{padding:1rem}.panel-b.flush{padding:0}
.panel-f{display:flex;align-items:center;gap:.6rem;justify-content:space-between;padding:.65rem 1rem;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r) var(--r);font-size:.8125rem;color:var(--text-3);flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.75rem;margin-bottom:1.25rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem;display:flex;flex-direction:column;gap:.4rem}
.stat>span{font-size:.78rem;color:var(--text-3);font-weight:550}
.stat strong{font-size:1.6rem;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat strong small{font-size:1rem;font-weight:500;color:var(--text-3)}
.cards{display:grid;gap:.6rem}
.card-link{display:flex;align-items:center;gap:.9rem;padding:.9rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%;transition:border-color .15s,background .15s}
.card-link:hover{border-color:var(--accent);background:var(--surface-2)}
.card-link .ico{width:38px;height:38px;border-radius:10px;background:var(--accent-weak);display:grid;place-items:center;flex:none}
.card-link b{display:block}.card-link span.d{color:var(--text-2);font-size:.8125rem}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:.8rem}
.bars li{display:grid;grid-template-columns:minmax(80px,150px) 1fr 3rem;gap:.8rem;align-items:center;font-size:.875rem}
.bars li span:last-child{text-align:right;color:var(--text-2)}
.list{list-style:none;margin:0;padding:0}.list>li{padding:.65rem 1rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.6rem}.list>li:last-child{border-bottom:0}
.empty{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;padding:1.8rem 1rem;color:var(--text-2)}.empty .icon{width:26px;height:26px;color:var(--text-3)}
.field-l{font-size:.8125rem;font-weight:600;color:var(--text-2);margin-bottom:.4rem;display:block}
.setup-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem 1rem;border-bottom:1px solid var(--line)}
.setup-row:last-child{border-bottom:0}.setup-row .t{max-width:34ch}.setup-row .t b{display:block;font-weight:600}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}

/* kviz */
.quiz{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1.25rem;align-items:start}
.figure{background:#0e0f10;border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;min-height:260px;max-height:calc(100vh - 140px);overflow:hidden;position:sticky;top:calc(var(--top) + 1rem)}
.figure img{max-width:100%;max-height:calc(100vh - 140px);display:block;object-fit:contain}
.q-label{font-size:.75rem;font-weight:600;color:var(--text-3);margin-bottom:.35rem}
.given{font-size:1.4rem;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.opts{display:grid;gap:.5rem}
.opt{display:flex;align-items:center;gap:.75rem;width:100%;text-align:left;padding:.7rem .8rem;background:var(--surface-2);border:1px solid var(--line-2);border-radius:var(--r-sm);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--text-2);background:var(--surface-3)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--good-weak);border-color:var(--good)}
.opt.bad{background:var(--bad-weak);border-color:var(--bad)}
.opt .l{flex:1}
.opt .mark{width:18px;height:18px}
.fb{display:flex;gap:.7rem;padding:.8rem .9rem;border-radius:var(--r);border:1px solid;margin-top:.9rem;animation:fadein .25s var(--ease)}
.fb .icon{margin-top:2px}
.fb.ok{background:var(--good-weak);border-color:color-mix(in srgb,var(--good) 45%,transparent)}.fb.ok .icon{color:var(--good)}
.fb.bad{background:var(--bad-weak);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}.fb.bad .icon{color:var(--bad)}
.fb.warn{background:var(--warn-weak);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}.fb.warn .icon{color:var(--warn)}
.fb b{display:block}.fb p{color:var(--text-2);font-size:.8125rem;margin-top:.15rem}
.qactions{display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap;align-items:center}

/* vysledky */
.big-num{font-size:3rem;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1}
.table{width:100%;border-collapse:collapse;font-size:.875rem}
.table th{text-align:left;font-size:.75rem;font-weight:600;color:var(--text-3);padding:.5rem 1rem;border-bottom:1px solid var(--line)}
.table td{padding:.55rem 1rem;border-bottom:1px solid var(--line)}.table tr:last-child td{border-bottom:0}

/* galerie */
.toolbar{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.search{position:relative;flex:1;min-width:180px;max-width:320px}.search .icon{position:absolute;left:.7rem;top:50%;translate:0 -50%;color:var(--text-3);pointer-events:none}.search .input{padding-left:2.2rem}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.8rem}
.gal{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;cursor:pointer;text-align:left;transition:border-color .15s,translate .15s var(--ease)}
.gal:hover{border-color:var(--line-2);translate:0 -2px}
.gal .im{aspect-ratio:4/3;background:#0e0f10;overflow:hidden}.gal img{width:100%;height:100%;object-fit:cover;display:block;transition:scale .25s var(--ease)}.gal:hover img{scale:1.04}
.gal .tx{padding:.6rem .75rem .75rem;display:grid;gap:.35rem;justify-items:start}.gal b{font-size:.875rem;font-weight:600;line-height:1.3}
.scrim{position:fixed;inset:0;z-index:60;background:rgb(0 0 0/.72);display:grid;place-items:center;padding:1rem;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.lightbox{width:min(980px,100%);max-height:94vh;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(240px,1fr);background:var(--surface);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.lightbox .im{background:#0e0f10;display:flex;align-items:center;justify-content:center;min-height:240px}.lightbox .im img{max-width:100%;max-height:90vh;display:block;object-fit:contain}
.lightbox .tx{padding:1.2rem;display:flex;flex-direction:column;gap:.7rem;overflow:auto}

@media(max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}.rail{display:none}
  .topbar{padding:0 .85rem}.content{padding:1rem .85rem 5.5rem}
  .quiz{grid-template-columns:minmax(0,1fr)}.figure{position:static;max-height:48vh;min-height:200px}.figure img{max-height:48vh}
  .bottombar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset:auto 0 0 0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .bottombar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:.5rem 0;font-size:.6875rem;color:var(--text-2);background:none;border:0;cursor:pointer}
  .bottombar button.active{color:var(--accent)}
  .lightbox{grid-template-columns:minmax(0,1fr);overflow:auto}.lightbox .im img{max-height:50vh}
  .bars li{grid-template-columns:1fr 3rem}.bars li .meter{grid-column:1/-1;order:3}
  .kbd.hint{display:none}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="app" id="root"></div>

<script>
/* ============================================================
   DATA – tady se dají upravit názvy, aliasy a období.
   aliases = další přijatelné odpovědi v režimu „Napiš název“
   (u víceslovných aliasů musí sedět všechna slova, překlepy se tolerují)
   ============================================================ */
const PERIODS = [
  {id:'paleolit', name:'Paleolit'},
  {id:'neolit',   name:'Neolit'},
  {id:'egypt',    name:'Egypt'},
  {id:'mezopotamie', name:'Mezopotámie'},
  {id:'krete',    name:'Kréta (minojská kultura)'},
  {id:'mykeny',   name:'Mykény (mykénská kultura)'},
  {id:'recko',    name:'Antické Řecko'}
];

const WORKS = [
  {f:'01.jpg', name:'Venuše z Willendorfu / Dolních Věstonic', p:'paleolit',
   aliases:['venuše','venuše z willendorfu','willendorfská venuše','venuše z dolních věstonic','věstonická venuše','dolnověstonická venuše','venuše z věstonic','soška venuše','paleolitická venuše'],
   info:'Paleolitické ženské sošky – symbol plodnosti.'},
  {f:'02.jpg', name:'Kamenný pastýř', p:'neolit',
   aliases:['menhir','menhir klobuky','zakletý pastýř','kamenný pastýř','menhir kamenný pastýř'],
   info:'Jeden svisle postavený kámen – megalitická stavba.'},
  {f:'03.jpg', name:'Kamenné řady v Carnacu', p:'neolit',
   aliases:['carnac','kamenné řady carnac','alinement','aleje menhirů','menhirové aleje','kamenná řada carnac','řady menhirů'],
   info:'Řady menhirů v Bretani (Francie).'},
  {f:'04.jpg', name:'Kamenné řady (Kounov)', p:'neolit',
   aliases:['kounov','kounovské řady','kounovské kamenné řady','kamenná řada kounov','kamenné řady kounov'],
   info:'Řada kamenů v krajině – megalitická památka (Kounov u Slaného).'},
  {f:'05.jpg', name:'Dolmen', p:'neolit',
   aliases:['dolmen','kamenný stůl','megalitický hrob','dolmen hrob'],
   info:'Kamenný „stůl“ – nosné kameny překryté deskou, hrobka.'},
  {f:'06.jpg', name:'Stonehenge', p:'neolit',
   aliases:['stonehenge','kromlech','cromlech','kamenný kruh','kruh stonehenge','kromlech stonehenge'],
   info:'Kromlech – kruh z kamenů s překlady, jižní Anglie.'},
  {f:'07.jpg', name:'Džoserova pyramida', p:'egypt',
   aliases:['džoserova pyramida','stupňovitá pyramida','pyramida','džoser','sakkára','pyramida v sakkáře','džoserova stupňovitá pyramida'],
   info:'Stupňovitá pyramida v Sakkáře, Stará říše, architekt Imhotep.'},
  {f:'08.jpg', name:'Abú Simbel', p:'egypt',
   aliases:['abú simbel','abu simbel','chrám v abú simbelu','chrám ramesse ii','skalní chrám','ramessův chrám','ramesse ii','chrám abu simbel'],
   info:'Skalní chrámy Ramesse II., Nová říše.'},
  {f:'09.jpg', name:'Busta Nefertiti', p:'egypt',
   aliases:['nefertiti','busta nefertiti','nefertitina busta','nofretete','nefertete','královna nefertiti','busta nofretete'],
   info:'Amarnské období, Nová říše.'},
  {f:'10.jpg', name:'Zlatá maska Tutanchamona', p:'egypt',
   aliases:['tutanchamon','tutanchamonova maska','maska tutanchamona','zlatá maska','tutanchamonova zlatá maska','maska faraona'],
   info:'Pohřební maska faraona, Nová říše.'},
  {f:'11.jpg', name:'Ištařina brána', p:'mezopotamie',

/* ---------- pomocné funkce ---------- */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
const STOP=new Set(['z','ze','v','ve','u','na','do','a','s','se','od','o','po','tzv','the','ii','kultura','kultury']);
const toks=s=>norm(s).split(' ').filter(t=>t&&!STOP.has(t));
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[n];}
function tokMatch(a,b){if(a===b)return true;const L=Math.max(a.length,b.length);
  if(Math.min(a.length,b.length)>=5&&(a.startsWith(b)||b.startsWith(a)))return true;
  const tol=L<=3?0:L<=5?1:L<=9?2:3;return lev(a,b)<=tol;}
function score(answer,work){const at=toks(answer);if(!at.length)return 0;let best=0;
  for(const al of [work.name,...work.aliases]){const tt=toks(al);if(!tt.length)continue;let hit=0;
    for(const t of tt)if(at.some(x=>tokMatch(t,x)))hit++;const cov=hit/tt.length;best=Math.max(best,cov===1?1:cov*.9);}
  return best;}
function judge(answer,work){const s=score(answer,work);if(s>=1)return{r:'ok'};
  let other=null,os=0;for(const w of WORKS){if(w===work)continue;const x=score(answer,w);if(x>os){os=x;other=w;}}
  if(os>=1)return{r:'bad',other};
  if(s>=.5&&toks(answer).length)return{r:'part'};return{r:'bad'};}

function fixLast(w){const s=DB.works[w.f];if(s&&s.h){s.h=s.h.slice(0,-1)+'1';persist();}}
const isWeak=w=>{const h=(DB.works[w.f]||{}).h||'';return h.length>0&&(h.endsWith('0')||(h.match(/0/g)||[]).length>=2);};

/* ---------- Kvíz ---------- */
function start(mode,pool){S={mode,order:pool.map(w=>WORKS.indexOf(w)),i:0,right:0,wrong:[],answered:false,total:pool.length};view='quiz';question();}
const cur=()=>WORKS[S.order[S.i]];
function paintProg(){const p=$('#tb-prog');p.classList.remove('hidden');
  p.innerHTML=`<span class="num">${S.i+(S.answered?1:0)} / ${S.total}</span><div class="meter"><div style="width:${(S.i+(S.answered?1:0))/S.total*100}%"></div></div><span class="badge good num">${S.right}</span><span class="badge bad num">${S.i+(S.answered?1:0)-S.right}</span>`;}
function question(){
  if(S.i>=S.total)return finish();
  S.answered=false;const w=cur();
  const fig=`<div class="figure"><img src="img/${w.f}" alt="Dílo k určení"></div>`;
  let side='';
  if(S.mode==='choice'){
    const others=shuffle(WORKS.filter(x=>x!==w&&x.name!==w.name));
    const same=others.filter(x=>x.p===w.p),diff=others.filter(x=>x.p!==w.p);
    const opts=shuffle([w,...shuffle([...same.slice(0,2),...diff]).slice(0,3)]);
    side=`<div class="q-label">Co je na obrázku?</div><div class="opts" id="opts">${opts.map((o,i)=>`<button class="opt" data-i="${WORKS.indexOf(o)}" data-key="${i+1}"><span class="kbd hint">${i+1}</span><span class="l">${esc(o.name)}</span></button>`).join('')}</div>`;
  }else if(S.mode==='period'){
    side=`<div class="q-label">Název díla</div><div class="given">${esc(w.name)}</div><div class="q-label" style="margin-top:1.1rem">Do jakého období patří?</div>
      <div class="opts" id="opts">${PERIODS.map((p,i)=>`<button class="opt" data-id="${p.id}" data-key="${i+1}"><span class="kbd hint">${i+1}</span><span class="l">${esc(p.name)}</span></button>`).join('')}</div>`;
  }else{
    side=`<div class="q-label">Napiš název díla</div>
      <form id="f" autocomplete="off" class="stack" style="gap:.6rem"><input class="input" id="ans" placeholder="např. Parthenon" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="row"><button class="btn primary" type="submit">Zkontrolovat</button><button class="btn ghost" type="button" id="dk">Nevím</button><span class="faint small sp" style="text-align:right"><span class="kbd hint">Enter</span></span></div></form>`;
  }
  const t=MODES[S.mode].name;
  setView(t,`<div class="quiz">${fig}<div><div class="panel"><div class="panel-b">${side}<div id="after"></div></div></div></div></div>`,S.mode);
  paintProg();
  if(S.mode==='write'){const inp=$('#ans');inp.focus();
    $('#f').onsubmit=e=>{e.preventDefault();const v=inp.value.trim();if(!v||S.answered)return;const j=judge(v,w);answerWrite(j.r,j.other);};
    $('#dk').onclick=()=>answerWrite('skip');}
  else $('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||S.answered)return;
    const ok=S.mode==='choice'?+b.dataset.i===S.order[S.i]:b.dataset.id===w.p;
    S.answered=true;const right=S.mode==='choice'?o=>+o.dataset.i===S.order[S.i]:o=>o.dataset.id===w.p;
    document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(right(o)){o.classList.add('ok');o.insertAdjacentHTML('beforeend',ico('check','mark'));}});
    if(!ok){b.classList.add('bad');b.insertAdjacentHTML('beforeend',ico('x','mark'));}
    record(w,ok);
    feedback(ok?'ok':'bad',ok?'Správně':'Špatně',S.mode==='choice'?`${esc(w.name)}`:`${esc(perName(w.p))}`,`${S.mode==='choice'?esc(perName(w.p))+'. ':''}${esc(w.info)}`);};
}
function record(w,ok){S.answered=true;if(ok)S.right++;else if(!S.wrong.includes(S.order[S.i]))S.wrong.push(S.order[S.i]);note(w,ok);paintProg();}
function nextBtnHtml(extra=''){return`<div class="qactions">${extra}<button class="btn primary" id="nx">${S.i+1>=S.total?'Dokončit':'Další'} ${ico('arrow','sm')}</button><span class="kbd hint">Enter</span></div>`;}
function feedback(cls,head,main,info,extra=''){
  const icn=cls==='ok'?'check':cls==='warn'?'info':'x';
  $('#after').innerHTML=`<div class="fb ${cls}">${ico(icn)}<div><b>${head}: ${main}</b><p>${info}</p></div></div>`+nextBtnHtml(extra);
  $('#nx').onclick=advance;const ov=$('#ov');
  if(ov)ov.onclick=()=>{S.right++;S.wrong=S.wrong.filter(x=>x!==S.order[S.i]);fixLast(cur());ov.remove();paintProg();};
  $('#after').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function answerWrite(kind,other){
  if(S.answered)return;const w=cur();const inp=$('#ans');
  const ok=kind==='ok';record(w,ok);inp.disabled=true;$('#dk').disabled=true;$('#f button[type=submit]').disabled=true;
  const ov=ok?'':`<button class="btn" id="ov" type="button">Měl jsem to správně</button>`;
  const info=`${esc(perName(w.p))}. ${esc(w.info)}`;
  if(ok)feedback('ok','Správně',esc(w.name),info);
  else if(kind==='part')feedback('warn','Skoro – chybí upřesnění. Správně je',esc(w.name),info,ov);
  else if(kind==='skip')feedback('bad','Správně je',esc(w.name),info,ov);
  else feedback('bad','Špatně. Správně je',esc(w.name),(other?`Tvoje odpověď sedí spíš k dílu „${esc(other.name)}“. `:'')+info,ov);
}
function advance(){S.i++;question();}
function finish(){
  DB.sessions++;const pct=S.total?Math.round(S.right/S.total*100):0;
  const prev=DB.best[S.mode];if(prev==null||pct>prev)DB.best[S.mode]=pct;persist();refreshNav();
  const wr=S.wrong.map(i=>WORKS[i]);const mode=S.mode,pool=S.order.map(i=>WORKS[i]);
  setView('Výsledek',`
  <div class="page-head"><h1>Hotovo</h1><p>${MODES[mode].name}</p></div>
  <div class="grid2">
   <div class="panel"><div class="panel-h"><h3>Co ti nešlo</h3><span class="badge ${wr.length?'bad':'good'}">${wr.length}</span></div>
    ${wr.length?`<table class="table"><thead><tr><th>Dílo</th><th>Období</th></tr></thead><tbody>${wr.map(w=>`<tr><td>${esc(w.name)}</td><td><span class="badge">${esc(perName(w.p))}</span></td></tr>`).join('')}</tbody></table>`
    :`<div class="empty">${ico('check')}<b>Bez chyby</b><span class="small">Všech ${S.total} děl správně.</span></div>`}</div>
   <div class="stack">
    <div class="panel"><div class="panel-b stack">
      <div><div class="faint small">Úspěšnost</div><div class="big-num">${pct}<small style="font-size:1.4rem;color:var(--text-3)"> %</small></div></div>
      <div class="meter ${pct>=80?'good':''}"><div style="width:${pct}%"></div></div>
      <div class="small muted">${S.right} z ${S.total} správně${DB.best[mode]===pct&&prev!=null&&pct>prev?' · <b>nový rekord</b>':` · nejlepší ${DB.best[mode]} %`}</div></div></div>
    <div class="stack" style="gap:.5rem">
      ${wr.length?`<button class="btn primary lg" id="rw">${ico('retry','sm')} Procvičit chyby</button>`:''}
      <button class="btn lg" id="again">Znovu stejné</button>
      <button class="btn ghost lg" id="back">Zpět na přehled</button></div>
   </div></div>`,'');
  const rw=$('#rw');if(rw)rw.onclick=()=>start(mode,shuffle(wr));
  $('#again').onclick=()=>start(mode,shuffle(pool));$('#back').onclick=()=>go('home');
  view='result';
}

/* ---------- Galerie ---------- */
let GF={q:'',p:'all'};
function gallery(){
  setView('Přehled děl',`
  <div class="page-head"><h1>Přehled děl</h1><p>Všechna díla s názvy a obdobími k učení. Klikni pro zvětšení.</p></div>
  <div class="toolbar"><div class="search">${ico('search','sm')}<input class="input" id="gq" placeholder="Hledat dílo…" value="${esc(GF.q)}"></div>
   <div class="chips"><button class="chip" data-p="all" aria-pressed="${GF.p==='all'}">Vše</button>${PERIODS.map(p=>`<button class="chip" data-p="${p.id}" aria-pressed="${GF.p===p.id}">${esc(p.name)}</button>`).join('')}</div></div>
  <div class="gallery" id="gal"></div>`,'gallery');
  const draw=()=>{const q=norm(GF.q);const ws=WORKS.filter(w=>(GF.p==='all'||w.p===GF.p)&&(!q||norm(w.name+' '+perName(w.p)).includes(q)));
    $('#gal').innerHTML=ws.length?ws.map(w=>`<button class="gal" data-i="${WORKS.indexOf(w)}"><div class="im"><img src="img/${w.f}" loading="lazy" alt=""></div><div class="tx"><b>${esc(w.name)}</b><span class="badge">${esc(perName(w.p))}</span></div></button>`).join('')
      :`<div class="empty" style="grid-column:1/-1">${ico('search')}<b>Nic nenalezeno</b></div>`;};
  draw();
  $('#gq').oninput=e=>{GF.q=e.target.value;draw();};
  document.querySelector('.toolbar .chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;GF.p=b.dataset.p;
    document.querySelectorAll('.toolbar .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.p===GF.p));draw();};
  $('#gal').onclick=e=>{const g=e.target.closest('.gal');if(g)lightbox(+g.dataset.i);};
}
let LB=null;
function lightbox(i){closeLb();const w=WORKS[i];const el=document.createElement('div');el.className='scrim';
  el.innerHTML=`<div class="lightbox" role="dialog"><div class="im"><img src="img/${w.f}" alt=""></div><div class="tx"><div class="row"><span class="badge">${esc(perName(w.p))}</span><span class="sp"></span><button class="btn ghost icon-only" id="lbx" title="Zavřít">${ico('x')}</button></div>
  <h2>${esc(w.name)}</h2><p class="muted">${esc(w.info)}</p><div class="sp"></div><div class="row"><button class="btn" id="lbp">←</button><button class="btn" id="lbn">→</button><span class="faint small">${i+1} / ${WORKS.length}</span></div></div></div>`;
  el.onclick=e=>{if(e.target===el)closeLb();};document.body.appendChild(el);LB={el,i};
  $('#lbx').onclick=closeLb;$('#lbp').onclick=()=>lightbox((i+WORKS.length-1)%WORKS.length);$('#lbn').onclick=()=>lightbox((i+1)%WORKS.length);}
function closeLb(){if(LB){LB.el.remove();LB=null;}}

/* ---------- klávesy ---------- */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(LB){if(e.key==='Escape')closeLb();else if(e.key==='ArrowLeft')lightbox((LB.i+WORKS.length-1)%WORKS.length);else if(e.key==='ArrowRight')lightbox((LB.i+1)%WORKS.length);return;}
  if(view!=='quiz'||!S)return;
  const ae=document.activeElement;const typing=ae&&ae.tagName==='INPUT'&&!ae.disabled;
  if(e.key==='Enter'&&S.answered&&!e.repeat){if(ae&&ae.tagName==='BUTTON'&&!ae.disabled)return;e.preventDefault();advance();return;}
  if(typing)return;
  if(/^[1-9]$/.test(e.key)&&!S.answered){const b=document.querySelector(`[data-key="${e.key}"]`);if(b)b.click();}
});
matchMedia('(prefers-color-scheme: light)').addEventListener?.('change',()=>{if(themePref()==='system')applyTheme('system');});

buildShell();home();
</script>
</body>
</html>
